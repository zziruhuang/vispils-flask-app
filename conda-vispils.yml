name: vispils
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # Python version (UPDATED from 3.6.10 to 3.11 - security and modern library support)
  - python=3.11

  # Core Web Framework
  - flask=3.0.3
  - flask-cors=4.0.0
  - werkzeug=3.0.3

  # Data Science & Analysis (all versions updated to Oct 2025)
  - numpy=1.26.4
  - pandas=2.2.2
  - scipy=1.13.1
  - scikit-learn=1.5.1

  # Chemistry & Molecular Tools
  - rdkit=2024.03.1
  - openbabel=3.1.1

  # Machine Learning (PyTorch - CPU default, uncomment GPU line for CUDA 12.1 support)
  - pytorch::pytorch=2.4.1
  # - pytorch::pytorch-cuda=12.1

  # Visualization & Image Processing
  - matplotlib=3.8.4
  - pillow=10.4.0

  # Development & Testing
  - requests=2.32.3
  - pytest=8.3.2
  - pip=24.3.1

  # Interactive development
  - ipython=8.17.2
  - jupyter=1.0.0
  - jupyterlab=4.0.9

  # Additional Python packages via pip
  - pip:
      - tensorboardx==2.6.2.2
      - pytest-flask==1.3.0
      - pytest-cov==5.0.0
      - python-dotenv==1.0.1
      - click==8.1.7
      - gunicorn==21.2.0
      - pybel==0.15.0

  # ============================================================================
  # DEPENDENCY UPDATE CHANGELOG (Oct 2025 Release)
  # ============================================================================
  #
  # CRITICAL UPDATES:
  # - Python: 3.6.10 → 3.11 (3.6 EOL: Dec 2021, SECURITY CRITICAL)
  #
  # MAJOR VERSION UPDATES:
  # - Flask: 2.3.3 → 3.0.3
  # - Werkzeug: 2.3.7 → 3.0.3
  # - torch: 2.0.1 → 2.4.1
  # - numpy: 1.24.3 → 1.26.4
  # - pandas: 2.0.3 → 2.2.2
  # - scipy: 1.11.1 → 1.13.1
  # - scikit-learn: 1.3.0 → 1.5.1
  # - matplotlib: 3.7.2 → 3.8.4
  # - pillow: 10.0.0 → 10.4.0
  #
  # OPTIMIZATIONS:
  # - Removed 500+ bloated transitive dependencies (was 554 lines, now ~60)
  # - Cleaned YAML structure for readability
  # - All packages pinned to specific versions for reproducibility
  #
  # PRODUCTION:
  # - gunicorn now enabled (was commented out)
  # - GPU support available (see pytorch-cuda commented line)
  #
  # USAGE:
  # conda env create -f conda-vispils.yml
  # conda activate vispils
